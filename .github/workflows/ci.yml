name: ci

on:
  push:
    branches: [ main, build-final-project ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-dev-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Build and start development stack
        run: |
          docker compose up -d --build

      - name: Wait for app to be ready
        run: |
          timeout 60 bash -c 'until curl -sf http://localhost:8765/; do sleep 2; done'

      - name: Verify homepage returns HTTP 200
        run: |
          curl --fail http://localhost:8765/

      - name: Verify schema and RUM extension
        run: |
          docker compose exec -T db psql -U hello_flask -d hello_flask_dev -tA \
            -c "SELECT COUNT(*) FROM pg_extension WHERE extname = 'rum';" | grep -qx 1
          docker compose exec -T db psql -U hello_flask -d hello_flask_dev -tA \
            -c "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('users','messages','credentials','follows');" | grep -qx 4
          docker compose exec -T db psql -U hello_flask -d hello_flask_dev -tA \
            -c "SELECT COUNT(*) FROM pg_indexes WHERE tablename='messages' AND indexname='idx_messages_rum' AND indexdef LIKE '%USING rum%';" | grep -qx 1

      - name: Show container status on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs

      - name: Tear down stack
        if: always()
        run: |
          docker compose down
