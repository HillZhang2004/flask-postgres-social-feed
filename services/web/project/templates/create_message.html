{% extends "base.html" %}
{% block content %}

<h1>New Message</h1>

{% if error %}
  <p class="error">{{ error }}</p>
{% endif %}

<form method="post">
  <p>
    <label>Message<br>
    <textarea name="body" rows="4" cols="60" required autofocus></textarea></label>
  </p>
  <p><button type="submit">Post Message</button></p>
</form>

{% endblock %}
