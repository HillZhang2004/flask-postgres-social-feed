{% extends "base.html" %}
{% block content %}

<h1>Login</h1>

{% if error %}
  <p class="error">{{ error }}</p>
{% endif %}

<form method="post">
  <p>
    <label>Username<br>
    <input type="text" name="username" required autofocus></label>
  </p>
  <p>
    <label>Password<br>
    <input type="password" name="password" required></label>
  </p>
  <p><button type="submit">Log In</button></p>
</form>
<p>No account? <a href="/create_account">Create one</a>.</p>

{% endblock %}
